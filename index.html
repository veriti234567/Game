<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Ведьмак: Наследие</title>
    
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="theme-color" content="#0a0a1a">
    
    <script>
        const manifest = {
            name: 'Ведьмак: Наследие',
            short_name: 'Ведьмак',
            start_url: location.href,
            display: 'standalone',
            orientation: 'landscape',
            background_color: '#0a0a1a',
            theme_color: '#4a9e6e',
            icons: [{
                src: 'data:image/svg+xml,' + encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" width="192" height="192"><rect width="192" height="192" fill="#0a0a1a"/><text x="96" y="96" text-anchor="middle" dy=".3em" font-size="80" fill="#4a9e6e">⚔️</text></svg>'),
                sizes: '192x192',
                type: 'image/svg+xml'
            }]
        };
        document.head.appendChild(Object.assign(document.createElement('link'), {
            rel: 'manifest',
            href: URL.createObjectURL(new Blob([JSON.stringify(manifest)], {type: 'application/json'}))
        }));
    </script>
    
    <style>
        *{margin:0;padding:0;box-sizing:border-box}
        body{background:#0a0a1a;display:flex;justify-content:center;align-items:center;height:100vh;overflow:hidden;font-family:monospace}
        canvas{border:2px solid #4a9e6e;background:#1a1a3e;max-width:100vw;max-height:100vh}
        #installBtn{position:fixed;top:10px;right:10px;z-index:100;padding:8px 16px;background:rgba(76,175,80,0.9);border:2px solid #4CAF50;color:white;border-radius:8px;cursor:pointer;font-size:14px;font-weight:bold;display:none}
    </style>
</head>
<body>

<canvas id="game" width="800" height="400"></canvas>
<button id="installBtn">📲 Установить игру</button>

<script>
// ========== PWA УСТАНОВКА (БЕЗ СКАЧИВАНИЯ) ==========
let deferredPrompt;
const installBtn = document.getElementById('installBtn');

window.addEventListener('beforeinstallprompt', (e) => {
    e.preventDefault();
    deferredPrompt = e;
    installBtn.style.display = 'block';
});

installBtn.addEventListener('click', async () => {
    if (deferredPrompt) {
        deferredPrompt.prompt();
        const { outcome } = await deferredPrompt.userChoice;
        if (outcome === 'accepted') {
            installBtn.style.display = 'none';
        }
        deferredPrompt = null;
    }
});

window.addEventListener('appinstalled', () => {
    installBtn.style.display = 'none';
});

if (window.matchMedia('(display-mode: standalone)').matches) {
    installBtn.style.display = 'none';
}

// Service Worker
if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register(
        URL.createObjectURL(new Blob([`
            self.addEventListener('install', e => e.waitUntil(self.skipWaiting()));
            self.addEventListener('activate', e => e.waitUntil(self.clients.claim()));
            self.addEventListener('fetch', e => e.respondWith(
                caches.match(e.request).then(r => r || fetch(e.request))
            ));
        `], {type: 'application/javascript'}))
    );
}

// ========== ИГРА ==========
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
const W = 800, H = 400;

const player = {x: 50, y: 320, w: 30, h: 40, vx: 0, vy: 0, hp: 5, onGround: false, facing: 1, attacking: false, attackTimer: 0, invincible: 0, bricks: 0, kills: 0};
let enemies = [], bricks = [], level = 1, boss = null;
const keys = {};

document.addEventListener('keydown', e => { keys[e.key] = true; e.preventDefault(); });
document.addEventListener('keyup', e => keys[e.key] = false);

function spawnLevel() {
    enemies = [];
    bricks = [];
    for (let i = 0; i < 2 + level; i++) {
        enemies.push({x: 100 + Math.random() * 600, y: 330, w: 28, h: 28, hp: 1 + Math.floor(level/2), speed: 0.5 + level * 0.1, dir: Math.random() > 0.5 ? 1 : -1});
    }
    for (let i = 0; i < 3 + level * 2; i++) {
        bricks.push({x: 50 + Math.random() * 700, y: 150 + Math.random() * 180, w: 16, h: 16, collected: false});
    }
    boss = level >= 3 ? {x: 700, y: 300, w: 50, h: 60, hp: 3 + level, speed: 1, dir: -1, attackTimer: 60} : null;
}

spawnLevel();

function update() {
    if (player.hp <= 0) return;
    
    player.vx = keys['ArrowLeft'] ? -3 : keys['ArrowRight'] ? 3 : 0;
    if (player.vx !== 0) player.facing = Math.sign(player.vx);
    
    if (keys['ArrowUp'] && player.onGround) { player.vy = -11; player.onGround = false; }
    if (keys[' '] && !player.attacking) { player.attacking = true; player.attackTimer = 15; }
    
    player.vy += 0.5;
    player.x += player.vx;
    player.y += player.vy;
    
    if (player.y >= 340) { player.y = 340; player.vy = 0; player.onGround = true; }
    player.x = Math.max(0, Math.min(W - player.w, player.x));
    if (player.attackTimer > 0) player.attackTimer--; else player.attacking = false;
    if (player.invincible > 0) player.invincible--;
    
    enemies.forEach(e => {
        if (e.hp <= 0) return;
        e.x += e.speed * e.dir;
        if (e.x < 30 || e.x > W - 30) e.dir *= -1;
        
        if (player.invincible <= 0 && player.x < e.x + e.w && player.x + player.w > e.x && player.y < e.y + e.h && player.y + player.h > e.y) {
            player.hp--;
            player.invincible = 60;
            player.x += player.x < e.x ? -20 : 20;
        }
        
        if (player.attacking && player.attackTimer > 8) {
            const ax = player.facing > 0 ? player.x + player.w : player.x - 35;
            if (ax < e.x + e.w && ax + 35 > e.x && player.y - 5 < e.y + e.h && player.y + player.h + 5 > e.y) {
                e.hp--;
                e.x += player.facing * 30;
                if (e.hp <= 0) { player.kills++; if (Math.random() < 0.5) player.bricks++; }
            }
        }
    });
    enemies = enemies.filter(e => e.hp > 0);
    
    if (boss) {
        boss.x += boss.speed * boss.dir;
        if (boss.x < 100 || boss.x > W - 100) boss.dir *= -1;
        boss.attackTimer--;
        if (boss.attackTimer <= 0 && Math.abs(boss.x - player.x) < 80 && player.invincible <= 0) {
            player.hp--;
            player.invincible = 60;
            boss.attackTimer = 60;
        }
        if (player.attacking && player.attackTimer > 8) {
            const ax = player.facing > 0 ? player.x + player.w : player.x - 35;
            if (ax < boss.x + boss.w && ax + 35 > boss.x && player.y - 5 < boss.y + boss.h && player.y + player.h + 5 > boss.y) {
                boss.hp--;
                boss.x += player.facing * 30;
                if (boss.hp <= 0) { player.kills++; for (let i = 0; i < 3; i++) player.bricks++; }
            }
        }
    }
    
    bricks.forEach(b => {
        if (!b.collected && player.x < b.x + b.w && player.x + player.w > b.x && player.y < b.y + b.h && player.y + player.h > b.y) {
            b.collected = true; player.bricks++;
        }
    });
    
    if (bricks.every(b => b.collected) && enemies.length === 0 && (!boss || boss.hp <= 0)) {
        level = level >= 5 ? 1 : level + 1;
        player.x = 50; player.y = 320; player.vy = 0; player.bricks = 0;
        spawnLevel();
    }
}

function draw() {
    ctx.clearRect(0, 0, W, H);
    ctx.fillStyle = '#1a1a3e'; ctx.fillRect(0, 0, W, H);
    ctx.fillStyle = '#3a5a3a'; ctx.fillRect(0, 360, W, 20);
    
    bricks.forEach(b => { if (!b.collected) { ctx.fillStyle = '#FFD700'; ctx.fillRect(b.x, b.y, b.w, b.h); } });
    
    enemies.forEach(e => {
        ctx.fillStyle = '#8D6E63'; ctx.fillRect(e.x, e.y, e.w, e.h);
        ctx.fillStyle = '#FFEB3B'; ctx.beginPath();
        ctx.arc(e.x + 8 + e.dir * 4, e.y + 10, 3, 0, Math.PI * 2);
        ctx.arc(e.x + 18 + e.dir * 4, e.y + 10, 3, 0, Math.PI * 2);
        ctx.fill();
    });
    
    if (boss && boss.hp > 0) {
        ctx.fillStyle = '#4A2A3A'; ctx.fillRect(boss.x, boss.y, boss.w, boss.h);
        ctx.fillStyle = '#FF0000'; ctx.beginPath();
        ctx.arc(boss.x + 15, boss.y + 20, 5, 0, Math.PI * 2);
        ctx.arc(boss.x + 35, boss.y + 20, 5, 0, Math.PI * 2);
        ctx.fill();
    }
    
    if (!(player.invincible > 0 && player.invincible % 10 < 5)) {
        ctx.fillStyle = player.hp <= 1 ? '#FF6B6B' : '#4FC3F7';
        ctx.fillRect(player.x, player.y, player.w, player.h);
        ctx.fillStyle = '#FFD700'; ctx.beginPath();
        ctx.arc(player.x + 10 + player.facing * 4, player.y + 12, 3, 0, Math.PI * 2);
        ctx.arc(player.x + 20 + player.facing * 4, player.y + 12, 3, 0, Math.PI * 2);
        ctx.fill();
    }
    
    if (player.hp <= 0) {
        ctx.fillStyle = 'rgba(0,0,0,0.8)'; ctx.fillRect(0, 0, W, H);
        ctx.fillStyle = '#FF4444'; ctx.font = '48px monospace'; ctx.textAlign = 'center';
        ctx.fillText('GAME OVER - ОБНОВИТЕ СТРАНИЦУ', W/2, H/2); ctx.textAlign = 'left';
    }
    
    ctx.fillStyle = '#fff'; ctx.font = '14px monospace';
    ctx.fillText(`❤️ ${player.hp} | 🧱 ${player.bricks} | 👹 ${player.kills} | 🏰 ${level}`, 10, 25);
}

function gameLoop() { update(); draw(); requestAnimationFrame(gameLoop); }
gameLoop();
</script>

</body>
</html>
